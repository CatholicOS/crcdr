name: "Validate"

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the unit tests
        run: python3 -I -m unittest discover -s scripts -v
      - name: Validate the data
        run: python3 -I scripts/validate.py
